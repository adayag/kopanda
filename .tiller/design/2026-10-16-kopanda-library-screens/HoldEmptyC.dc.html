  <div aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.3">

      </div>
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase">142 books</div>
    </div>
    <button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 20px; border: 0; border-bottom: 2px solid #2f2e2b; background: transparent; font: inherit; font-size: 17px; font-weight: 700; color: #2f2e2b; text-align: left">
      <span style="display: flex; align-items: center; gap: 14px">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 16l4 4 4-4M14 6h7M14 11h5M14 16h3"></path></svg>

    <button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 20px; border: 0; border-bottom: 2px solid #2f2e2b; background: transparent; font: inherit; font-size: 17px; font-weight: 700; color: #2f2e2b; text-align: left">
      <span style="display: flex; align-items: center; gap: 14px">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 8v6l-4-2v-4z"></path></svg>

    </button>
    <button type="button" style="display: flex; align-items: center; gap: 14px; padding: 15px 20px; border: 0; background: transparent; font: inherit; font-size: 17px; font-weight: 700; color: #2f2e2b; text-align: left">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span>Refresh covers</span>
