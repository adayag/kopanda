<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diner, hold on a folder tile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Caveat:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2f2e2b}a:hover{color:#2f2e2b}
</style>
</helmet>
<div style="width: 632px; height: 840px; box-sizing: border-box; background: #f5f1e6; color: #2f2e2b; font-family: 'Bricolage Grotesque', sans-serif; position: relative; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.3">
    <div style="background: #e0bd6a; padding: 28px 40px 18px 40px; border-bottom: 4px solid #2f2e2b">
      <div style="font-family: Caveat, cursive; font-size: 24px; line-height: 1">142 books on the shelf</div>
      <div style="font-size: 40px; font-weight: 800; line-height: 0.95">Library</div>
    </div>
    <div style="padding: 22px 40px 0 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px">
      <div style="height: 220px; background: #e8a59d; border: 3px solid #2f2e2b"></div>
      <div style="height: 220px; background: #2b4c6f; border: 3px solid #2f2e2b"></div>
      <div style="height: 220px; background: #8a4b3a; border: 3px solid #2f2e2b"></div>
      <div style="height: 220px; background: #5e7a4a; border: 3px solid #2f2e2b"></div>
      <div style="height: 220px; background: #c9a24a; border: 3px solid #2f2e2b"></div>
      <div style="height: 220px; background: #44474f; border: 3px solid #2f2e2b"></div>
    </div>
  </div>

  <div role="dialog" aria-label="Hugo winners" style="position: absolute; left: 22px; right: 22px; bottom: 22px; background: #f5f1e6; border: 3px solid #2f2e2b; box-shadow: 8px 8px 0 #2f2e2b; display: flex; flex-direction: column">
    <div style="display: flex; gap: 16px; align-items: center; padding: 18px 20px; background: #e8a59d; border-bottom: 3px solid #2f2e2b">
      <div style="width: 60px; height: 60px; flex: none; background: #f5f1e6; border: 2px solid #2f2e2b; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2f2e2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
        <div style="font-size: 24px; font-weight: 800; line-height: 1.05">Hugo winners</div>
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">14 books · 3 reading · 6 finished</div>
      </div>
    </div>
    <button type="button" style="display: flex; align-items: center; gap: 14px; padding: 15px 20px; border: 0; border-bottom: 2px solid #2f2e2b; background: transparent; font: inherit; font-size: 17px; font-weight: 700; color: #2f2e2b; text-align: left">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"></path><path d="M10 13h6M13 10l3 3-3 3"></path></svg>
      <span>Open</span>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 14px; padding: 15px 20px; border: 0; border-bottom: 2px solid #2f2e2b; background: transparent; font: inherit; font-size: 17px; font-weight: 700; color: #2f2e2b; text-align: left">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 6l4-1 3 15-4 1z"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span>Set as library root</span>
        <span style="font-size: 12px; font-weight: 500">The Library tab opens here</span>
      </span>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 14px; padding: 15px 20px; border: 0; background: transparent; font: inherit; font-size: 17px; font-weight: 700; color: #2f2e2b; text-align: left">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-3 3.4M6.6 7.6C4.3 9.2 3 12 3 12s4 6 9 6a9 9 0 0 0 4-1"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span>Hide</span>
        <span style="font-size: 12px; font-weight: 500">Still on the Kindle, gone from the grid</span>
      </span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":632,"height":840}}'>

</html>
