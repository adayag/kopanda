# Tiller project manifest. Generated by "tiller init"; edit freely.
# Inline comments describe each block; .tiller/orientation.md covers where things live.

schema_version: 10
schema_epoch: initial

project:
  name: "KoPanda"
  key: kopanda
  kind: greenfield            # greenfield | brownfield | legacy-migration
  # requires_tiller: ">= 1.0"   # optional advisory minimum binary


# The humans who hold work. A human registers each one with
# `tiller add contributor <id> --name "<name>"`.
contributors:
  - { id: "allen", name: "Allen Dayag" }

# Where decomposition reads from. Put design docs under .tiller/design/.
inputs:
  docs:
    - design/
  current_state: []
  code: []
  imported_from:
    - { path: "~/Projects/elatedpanda/koreader-theme-studio/.tiller/design/handoff-2026-10-08.md", at: "2026-10-14T01:25:55Z" }
    # 2026-10-13-kopanda-design.md was written in the brainstorming session that created this repo.

# Required gates are command-backed and define clean completion. The evals gate
# is active by default: it runs each feature's acceptance contract (the *.eval.md
# criteria) through "tiller eval". The contract gates the feature; tasks, bugs,
# chores and tweaks gate on build and unit_tests, so mid-feature task PRs flow
# one reviewable diff at a time.
gates:
  required:
    evals: { kind: command, run: "tiller eval ${node.noun} ${node.id}", on: [feature] }
    build: { kind: command, run: "bin/check --lint", on: [feature, task] }
    # A task, bug, chore or tweak (Tiller matches all four as task) runs lint, studio and unit specs;
    # the feature runs the emulator layer too. Keep `tests` the full run: eval test bindings append
    # their spec paths to its command.
    unit_tests: { kind: command, run: "bin/check --unit", on: [task] }
    tests: { kind: command, run: "bin/check", on: [feature] }
  optional:
    code_review:          { kind: attestation, on: pr }
    security_review:      { kind: attestation, on: pr }
    performance_review:   { kind: attestation, on: pr }
    accessibility_review: { kind: attestation, on: pr }

git:
  branch_pattern: "tiller/${node.key}"
  integration_branch: "main"   # the branch merges land on; "tiller sync" observes done crossings into it
  pr_coherence: true

drift:
  checks: [stale_spec, active_basis, answered_question, missing_surface, orphan_eval, stale_design]
