questions:
    - id: Q-irxgmk
      title: Quick settings entry point
      statement: 'Where does the quick-settings sheet open from: the home sheet, a launcher entry, a hold on the nav bar''s Settings tab, or more than one of these?'
      owner: allen
      blocks:
        - F-rce9ko
      status: answered
      answer: 'Both: a hold on the nav bar''s Settings tab (reserved by nav-bar D3; works on the home and over the file browser) and a new KoPanda launcher target the owner can place on the home. Not the home sheet.'
      answer_revision:
        kind: git_commit
        value: git:45fd7e9
        observed_at: 2026-10-16T19:40:34.490738Z
      source: design/2026-10-13-kopanda-ui-direction.md
    - id: Q-14rjkm
      title: Remove the library prebuild on close?
      statement: Remove the library's prebuild on book close, as B-2o8ya3 did for the home? It saves no wall time on KOReader's synchronous close-then-show stack and costs a tile rebuild per return, a full build per reload, switch and exit, and a stale count and filter on return. Removing it amends cover-grid D4 and C8 (feature.md:57-58, :139-141, :313-318; feature.eval.md:40) and library_golden_spec.lua:151, and the same amendment should carry B-2o8ya3's outstanding home-side rewrites (design :85-86, launcher C10, sheets :63, home-layout :65, night-mode C4).
      owner: allen
      status: answered
      answer: 'Yes. Remove the library''s prebuild on book close: show_return builds the library synchronously at the file manager''s Show, as B-2o8ya3 did for the home. One amendment rewrites cover-grid D4 and C8 (and feature.md''s Kept current and Book close) and carries B-2o8ya3''s home-side rewrites (design :85-86, launcher C10, sheets :63, home-layout :65, night-mode C4).'
      answer_revision:
        kind: git_commit
        value: git:fb6f275
        observed_at: 2026-10-17T18:47:03.931816Z
      source: .tiller/reviews/2026-10-17-efficiency-review-pass2.md#L187-L233
