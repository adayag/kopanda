questions:
    - id: Q-irxgmk
      title: Quick settings entry point
      statement: 'Where does the quick-settings sheet open from: the home sheet, a launcher entry, a hold on the nav bar''s Settings tab, or more than one of these?'
      owner: allen
      blocks:
        - F-rce9ko
      status: answered
      answer: 'Both: a hold on the nav bar''s Settings tab (reserved by nav-bar D3; works on the home and over the file browser) and a new KoPanda launcher target the owner can place on the home. Not the home sheet.'
